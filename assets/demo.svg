<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">secondlook in a Pi session</title>
  <desc id="desc">Illustration of a coding session: after three failing test runs the advisor is consulted automatically and finds the root cause; before finishing, the advisor review flags an untested path, which the agent then covers.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a35"/>
      <stop offset="1" stop-color="#1b2029"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #7d8590; }
    .prompt { fill: #e6edf3; font-weight: 600; }
    .caret { fill: #8b5cf6; font-weight: 700; }
    .tool { fill: #79c0ff; }
    .ok { fill: #3fb950; }
    .bad { fill: #f85149; }
    .add { fill: #3fb950; }
    .del { fill: #f85149; }
    .adv { fill: #c4a7ff; font-weight: 700; }
    .advtext { fill: #e2d9ff; }
    .warn { fill: #e3b341; font-weight: 700; }
    .final { fill: #e6edf3; }
    .status { font-size: 12.5px; fill: #9aa4b2; }
    .statusAccent { font-size: 12.5px; fill: #c4a7ff; font-weight: 600; }
    .title { font-size: 12.5px; fill: #9aa4b2; }
  </style>

  <g filter="url(#shadow)">
    <rect x="20" y="16" width="880" height="560" rx="12" fill="#0d1117"/>
  </g>
  <rect x="20" y="16" width="880" height="560" rx="12" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <path d="M20 28a12 12 0 0 1 12-12h856a12 12 0 0 1 12 12v22H20z" fill="url(#bar)"/>
  <circle cx="42" cy="33" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="33" r="6" fill="#febc2e"/>
  <circle cx="82" cy="33" r="6" fill="#28c840"/>
  <text x="460" y="37" text-anchor="middle" class="title">pi — ~/shop-api</text>
  <line x1="20" y1="50" x2="900" y2="50" stroke="#30363d"/>

  <!-- session -->
  <text x="44" y="84"><tspan class="caret">&gt;</tspan><tspan class="prompt"> Fix the race condition in the order queue and add a test</tspan></text>

  <text x="44" y="118"><tspan class="dim">●</tspan><tspan class="tool"> Read</tspan> src/queue/worker.ts</text>
  <text x="44" y="142"><tspan class="dim">●</tspan><tspan class="tool"> Edit</tspan> src/queue/worker.ts</text><text x="480" y="142"><tspan class="add">+18</tspan> <tspan class="del">−6</tspan></text>
  <text x="44" y="166"><tspan class="dim">●</tspan><tspan class="tool"> Bash</tspan> npm test</text><text x="480" y="166"><tspan class="bad">✗ 2 failed</tspan></text>
  <text x="44" y="190"><tspan class="dim">●</tspan><tspan class="tool"> Bash</tspan> npm test -- --runInBand</text><text x="480" y="190"><tspan class="bad">✗ 2 failed</tspan></text>
  <text x="44" y="214"><tspan class="dim">●</tspan><tspan class="tool"> Bash</tspan> npm test</text><text x="480" y="214"><tspan class="bad">✗ 2 failed</tspan></text>

  <!-- automatic consultation after failures -->
  <rect x="44" y="230" width="832" height="78" rx="8" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="60" y="254"><tspan class="adv">◆ secondlook</tspan><tspan class="dim"> · after 3 consecutive tool failures · anthropic/claude-opus-4-6</tspan></text>
  <text x="60" y="278" class="advtext">Root cause: the tests share one Redis key prefix, so parallel workers collide.</text>
  <text x="60" y="298" class="advtext">Retrying will not help — give each test its own prefix, then re-run.</text>

  <text x="44" y="336"><tspan class="dim">●</tspan><tspan class="tool"> Edit</tspan> test/queue.test.ts</text><text x="480" y="336"><tspan class="add">+9</tspan> <tspan class="del">−2</tspan></text>
  <text x="44" y="360"><tspan class="dim">●</tspan><tspan class="tool"> Bash</tspan> npm test</text><text x="480" y="360"><tspan class="ok">✓ 48 passed</tspan></text>

  <!-- review before finishing -->
  <rect x="44" y="376" width="832" height="78" rx="8" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="60" y="400"><tspan class="adv">◆ secondlook review</tspan><tspan class="dim"> · before finishing</tspan></text>
  <text x="60" y="424"><tspan class="warn">VERDICT: NEEDS_WORK</tspan></text>
  <text x="60" y="444" class="advtext">- The lock-timeout path in worker.ts is still untested.</text>

  <text x="44" y="482"><tspan class="dim">●</tspan><tspan class="tool"> Edit</tspan> test/queue.test.ts</text><text x="480" y="482"><tspan class="add">+14</tspan></text>
  <text x="44" y="506"><tspan class="dim">●</tspan><tspan class="tool"> Bash</tspan> npm test</text><text x="480" y="506"><tspan class="ok">✓ 49 passed</tspan></text>
  <text x="44" y="536" class="final">Fixed the race with a per-job lock; tests cover both the success and timeout paths.</text>

  <!-- status bar -->
  <path d="M20 552h880v12a12 12 0 0 1-12 12H32a12 12 0 0 1-12-12z" fill="#161b22"/>
  <line x1="20" y1="552" x2="900" y2="552" stroke="#30363d"/>
  <text x="40" y="568"><tspan class="statusAccent">Advisor: anthropic/claude-opus-4-6</tspan></text>
  <text x="880" y="568" text-anchor="end" class="status">2 consultations · 18.4k in / 0.6k out</text>
</svg>
