<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="920" height="1010" viewBox="0 0 920 1010" role="img" aria-labelledby="title desc">
  <title id="title">How secondlook works</title>
  <desc id="desc">Diagram: deepseek-v4-pro is the main agent and does the work with its tools; claude-opus-5-5 is the advisor on call. It is consulted when the agent calls the advisor tool, automatically after three tool failures in a row, or when you run /advisor ask; advice returns to the agent, which keeps working. When the agent is about to finish, an automatic review returns a verdict and real gaps get one more round.</desc>
  <defs>
    <marker id="arrowO" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79a8ff"/></marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #c9d1d9; }
    .b { font-weight: 700; }
    .w { fill: #f0f3f6; }
    .d { fill: #8b949e; }
    .dd { fill: #6e7681; }
    .o { fill: #f0883e; }
    .p { fill: #b9a3ff; }
    .g { fill: #56d364; }
    .r { fill: #ff7b72; }
    .bl { fill: #79a8ff; }
    .y { fill: #e3b341; }
    .sm { font-size: 11px; }
    .h { font-size: 14px; }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="919" height="1009" rx="10" fill="#0b0f17" stroke="#2a3140"/>
  <path d="M0.5 10.5a10 10 0 0 1 10-10h899a10 10 0 0 1 10 10v20H0.5z" fill="#151a24"/>
  <circle cx="20" cy="16" r="5.5" fill="#ff5f57"/><circle cx="38" cy="16" r="5.5" fill="#febc2e"/><circle cx="56" cy="16" r="5.5" fill="#28c840"/>
  <text x="460" y="20" text-anchor="middle" class="sm dd">~/app · zsh · 92×58</text>

  <!-- header -->
  <text x="460" y="62" text-anchor="middle" class="h b"><tspan class="w">SECONDLOOK</tspan><tspan class="dd">  ·  </tspan><tspan class="o">DEEPSEEK-V4-PRO</tspan><tspan class="w"> BUILDS</tspan><tspan class="dd">  ·  </tspan><tspan class="p">CLAUDE-OPUS-5-5</tspan><tspan class="w"> LOOKS TWICE</tspan></text>
  <line x1="24" y1="78" x2="896" y2="78" stroke="#3a4252" stroke-width="2"/>

  <!-- legend -->
  <rect x="30" y="96" width="9" height="9" fill="#f0883e"/><text x="46" y="105">deepseek-v4-pro · <tspan class="d">lead</tspan></text>
  <rect x="262" y="96" width="9" height="9" fill="#56d364"/><text x="278" y="105">tools · <tspan class="d">work</tspan></text>
  <rect x="400" y="96" width="9" height="9" fill="#a78bfa"/><text x="416" y="105">claude-opus-5-5 · <tspan class="d">advisor</tspan></text>
  <rect x="680" y="96" width="9" height="9" fill="#79a8ff"/><text x="696" y="105">you · <tspan class="d">/advisor ask</tspan></text>

  <!-- ===== left panel: the advisor ===== -->
  <rect x="24" y="126" width="226" height="704" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="137" y="150" text-anchor="middle" class="b p h">ADVISOR</text>
  <text x="137" y="170" text-anchor="middle">claude-opus-5-5 · <tspan class="p">on call</tspan></text>

  <text x="38" y="200"><tspan class="p">◇</tspan> agent asks</text>
  <line x1="44" y1="210" x2="44" y2="540" stroke="#3a3256" stroke-dasharray="2 4"/>
  <text x="56" y="222" class="dd">it decides when,</text>
  <text x="56" y="240" class="dd">e.g. before a plan</text>
  <text x="56" y="272" class="d">reads the whole</text>
  <text x="56" y="290" class="d">session: every</text>
  <text x="56" y="308" class="d">message, tool call</text>
  <text x="56" y="326" class="d">and result</text>
  <text x="56" y="350" class="d">+ evidence the agent</text>
  <text x="56" y="368" class="d">attaches as context</text>

  <text x="56" y="404">last advice:</text>
  <text x="56" y="424" class="b p">» isolate Redis prefix</text>
  <text x="56" y="442" class="b p">» test the timeout</text>

  <text x="56" y="478">calls</text><text x="236" y="478" text-anchor="end" class="b w">2 / 20</text>
  <text x="56" y="496">tokens read</text><text x="236" y="496" text-anchor="end" class="b w">18.4k</text>

  <text x="56" y="526" class="d">silent on routine</text>
  <text x="56" y="544" class="d">turns</text>

  <text x="38" y="574"><tspan class="p">◇</tspan> 3 failures in a row</text>
  <line x1="44" y1="584" x2="44" y2="754" stroke="#3a3256" stroke-dasharray="2 4"/>
  <text x="56" y="612" class="d">no tools, no file</text>
  <text x="56" y="630" class="d">access. never writes</text>
  <text x="56" y="648" class="d">code itself — the</text>
  <text x="56" y="666" class="d">main agent checks</text>
  <text x="56" y="684" class="d">the advice against</text>
  <text x="56" y="702" class="d">real evidence.</text>

  <text x="38" y="776"><tspan class="p">◇</tspan> about to finish</text>
  <text x="56" y="800" class="d">one review per</text>
  <text x="56" y="818" class="d">request</text>

  <!-- trigger connectors -->
  <line x1="132" y1="196" x2="430" y2="196" stroke="#a78bfa" stroke-opacity="0.6" stroke-dasharray="2 4" marker-end="url(#arrowP)"/>
  <line x1="212" y1="570" x2="279" y2="570" stroke="#a78bfa" stroke-opacity="0.6" stroke-dasharray="2 4" marker-end="url(#arrowP)"/>
  <line x1="172" y1="772" x2="396" y2="772" stroke="#a78bfa" stroke-opacity="0.6" stroke-dasharray="2 4" marker-end="url(#arrowP)"/>

  <!-- ===== main agent ===== -->
  <rect x="438" y="126" width="300" height="104" fill="none" stroke="#f0883e" stroke-width="1.5"/>
  <text x="588" y="152" text-anchor="middle" class="b o">deepseek-v4-pro · main agent</text>
  <text x="588" y="174" text-anchor="middle" class="w">edits code + runs tests</text>
  <text x="588" y="196" text-anchor="middle" class="d">runs in <tspan class="w">Pi</tspan> or <tspan class="w">dsh</tspan></text>
  <text x="588" y="218" text-anchor="middle" class="dd">tool: advisor(question, context)</text>

  <!-- ===== you ===== -->
  <rect x="756" y="136" width="140" height="62" fill="none" stroke="#79a8ff" stroke-width="1.5"/>
  <text x="826" y="160" text-anchor="middle" class="b bl">YOU</text>
  <text x="826" y="182" text-anchor="middle" class="d">any time</text>
  <line x1="826" y1="198" x2="826" y2="484" stroke="#79a8ff" stroke-opacity="0.6" stroke-dasharray="2 4" marker-end="url(#arrowB)"/>

  <line x1="588" y1="230" x2="588" y2="270" stroke="#f0883e" stroke-dasharray="3 4" marker-end="url(#arrowO)"/>

  <!-- ===== tools ===== -->
  <rect x="384" y="280" width="408" height="128" fill="none" stroke="#56d364" stroke-width="1.5"/>
  <text x="398" y="304" class="b g">TOOLS · the actual work</text><text x="778" y="304" text-anchor="end"><tspan class="d">calls </tspan><tspan class="b w">14</tspan></text>
  <text x="398" y="328" class="w">read / grep</text>
  <rect x="540" y="318" width="120" height="13" fill="#2ea043"/><rect x="660" y="318" width="10" height="13" fill="#1f3a25"/>
  <text x="778" y="328" text-anchor="end" class="g">✓ 6 ok</text>
  <text x="398" y="350" class="w">edit</text>
  <rect x="540" y="340" width="84" height="13" fill="#2ea043"/><rect x="624" y="340" width="46" height="13" fill="#1f3a25"/>
  <text x="778" y="350" text-anchor="end" class="g">✓ 4 ok</text>
  <text x="398" y="372" class="w">bash npm test</text>
  <rect x="540" y="362" width="38" height="13" fill="#da3633"/><rect x="578" y="362" width="92" height="13" fill="#3a1d1d"/>
  <text x="778" y="372" text-anchor="end" class="r">✗ 3 in a row</text>
  <text x="398" y="396"><tspan class="d">any 3 failures → </tspan><tspan class="p">auto consult</tspan><tspan class="d">  success → reset</tspan></text>

  <circle cx="588" cy="422" r="3.5" fill="#a78bfa"/>
  <text x="588" y="448" text-anchor="middle" class="w">consult the advisor · <tspan class="b p">3 ways</tspan></text>

  <!-- fan out (agent side) -->
  <path d="M588 458V470M370 470H588M370 470V490M588 470V490" fill="none" stroke="#4b5263" stroke-dasharray="2 4"/>
  <path d="M370 482l-4 -6h8z M588 482l-4 -6h8z" fill="#8b949e"/>

  <!-- three ways -->
  <rect x="285" y="494" width="170" height="140" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="370" y="518" text-anchor="middle" class="b w">on failures</text>
  <text x="370" y="538" text-anchor="middle" class="p">auto · 3 in a row</text>
  <rect x="301" y="550" width="138" height="13" fill="#8b6cf0"/>
  <text x="370" y="582" text-anchor="middle" class="d">finds the root cause</text>
  <text x="370" y="602" text-anchor="middle" class="d">rides on the result</text>
  <text x="370" y="624" text-anchor="middle" class="sm g">✓ reviewed</text>

  <rect x="503" y="494" width="170" height="140" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="588" y="518" text-anchor="middle" class="b w">advisor tool</text>
  <text x="588" y="538" text-anchor="middle" class="p">agent asks · manual</text>
  <rect x="519" y="550" width="138" height="13" fill="#2a2342"/><rect x="519" y="550" width="90" height="13" fill="#8b6cf0"/>
  <text x="588" y="582" text-anchor="middle" class="d">question + diff/logs</text>
  <text x="588" y="602" text-anchor="middle" class="d">before risky plans</text>
  <text x="588" y="624" text-anchor="middle" class="sm p">◐ advising</text>

  <rect x="721" y="494" width="170" height="140" fill="none" stroke="#79a8ff" stroke-width="1.5"/>
  <text x="806" y="518" text-anchor="middle" class="b w">/advisor ask</text>
  <text x="806" y="538" text-anchor="middle" class="bl">you ask · any time</text>
  <rect x="737" y="550" width="138" height="13" fill="#1c2840"/><rect x="737" y="550" width="38" height="13" fill="#4a7bd8"/>
  <text x="806" y="582" text-anchor="middle" class="d">"is it on track?"</text>
  <text x="806" y="602" text-anchor="middle" class="d">answer → you only</text>
  <text x="806" y="624" text-anchor="middle" class="sm bl">◐ not in context</text>

  <!-- results -->
  <path d="M370 634V656H588M588 634V692" fill="none" stroke="#4b5263" stroke-dasharray="2 4"/>
  <circle cx="478" cy="656" r="3" fill="#a78bfa"/><circle cx="588" cy="656" r="3" fill="#8b949e"/>
  <text x="578" y="680" text-anchor="end" class="sm d">↺ advice back to the agent,</text>
  <text x="578" y="694" text-anchor="end" class="sm d">it keeps working</text>
  <text x="598" y="680" class="sm d">then, about</text>
  <text x="598" y="694" class="sm d">to finish</text>
  <path d="M588 698l-5 -8h10z" fill="#f0883e"/>
  <path d="M806 634V652" fill="none" stroke="#79a8ff" stroke-opacity="0.5" stroke-dasharray="2 4"/>
  <text x="806" y="670" text-anchor="middle" class="sm bl">→ shown to you</text>

  <!-- review before done -->
  <rect x="404" y="706" width="368" height="104" fill="none" stroke="#f0883e" stroke-width="1.5"/>
  <text x="588" y="730" text-anchor="middle" class="b o">review before done · <tspan class="p">auto</tspan></text>
  <text x="588" y="754" text-anchor="middle"><tspan class="y b">VERDICT: NEEDS_WORK</tspan><tspan class="d"> → one more round</tspan></text>
  <text x="588" y="776" text-anchor="middle"><tspan class="g b">VERDICT: COMPLETE</tspan><tspan class="d">   → hand back to you</tspan></text>
  <text x="588" y="798" text-anchor="middle" class="dd">if ≥3 tool calls · once per request</text>

  <!-- ===== session log ===== -->
  <rect x="24" y="852" width="872" height="104" fill="none" stroke="#3a4252"/>
  <rect x="58" y="844" width="96" height="16" fill="#0b0f17"/>
  <text x="66" y="857" class="d">session log</text>
  <text x="40" y="880" class="dd">17:02:11</text><text x="122" y="880" class="b g">bash</text><text x="230" y="880">npm test → <tspan class="r">✗ 2 tests failed</tspan></text><text x="590" y="880" class="d">failure 3/3</text>
  <text x="40" y="900" class="dd">17:02:14</text><text x="122" y="900" class="b p">advisor</text><text x="230" y="900">auto · root cause → shared Redis prefix</text><text x="590" y="900" class="d">sent to agent</text>
  <text x="40" y="920" class="dd">17:03:52</text><text x="122" y="920" class="b p">review</text><text x="230" y="920"><tspan class="y">NEEDS_WORK</tspan> · timeout path untested</text><text x="590" y="920" class="d">one more round</text>
  <text x="40" y="940" class="dd">17:04:31</text><text x="122" y="940" class="b o">agent</text><text x="230" y="940">npm test → <tspan class="g">✓ 49 passed</tspan></text><text x="590" y="940" class="d">done · handed back</text>

  <!-- ===== prompt + status ===== -->
  <text x="24" y="980"><tspan class="bl">~/app $</tspan><tspan class="w"> pi --model deepseek/deepseek-v4-pro </tspan><tspan class="p">--advisor</tspan><tspan class="w"> anthropic/claude-opus-5-5 █</tspan></text>
  <text x="24" y="1000" class="d">advisor <tspan class="b p">[claude-opus-5-5]</tspan>   review <tspan class="b g">[on]</tspan>   failures <tspan class="b w">[3]</tspan>   limit <tspan class="b w">[2/20]</tspan>   tokens <tspan class="b w">[18.4k in / 0.6k out]</tspan></text>
</svg>
