# DeepSeek Harness layer: mounts the advisor plugin.
# Override this row (id: openadvisor) in a profile's cordis.patch.yml to set config, e.g.:
#   config:
#     model: deepseek/deepseek-reasoner
#     maxTokens: 4096
#     timeoutMs: 120000
- insert:
    - id: openadvisor
      name: openadvisor/dsh
